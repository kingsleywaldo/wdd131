<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Review Form</title>

    <meta name="description" content="Product review form for customers to submit feedback.">
    <meta name="author" content="Kingsley Waldo">

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>
</head>

<body>

<header>
    <h1>Product Review</h1>
</header>

<main>

<form method="get" action="review.html">

<label for="product">Product Name <span>*</span></label>

<select id="product" name="product" required>
    <option value="">Select a Product</option>
</select>


<label>Overall Rating <span>*</span></label>

<div class="rating">
    <label><input type="radio" name="rating" value="1" required> ⭐</label>
    <label><input type="radio" name="rating" value="2"> ⭐⭐</label>
    <label><input type="radio" name="rating" value="3"> ⭐⭐⭐</label>
    <label><input type="radio" name="rating" value="4"> ⭐⭐⭐⭐</label>
    <label><input type="radio" name="rating" value="5"> ⭐⭐⭐⭐⭐</label>
</div>


<label for="date">Date Installed <span>*</span></label>

<input type="date" id="date" name="date" required>


<label>Useful Features (Check all that apply)</label>

<label>
<input type="checkbox" name="features" value="easy">
Easy to Use
</label>

<label>
<input type="checkbox" name="features" value="quality">
Good Quality
</label>

<label>
<input type="checkbox" name="features" value="design">
Great Design
</label>

<label>
<input type="checkbox" name="features" value="price">
Affordable Price
</label>


<label for="review">
Written Review
</label>

<textarea id="review" name="review"></textarea>


<label for="name">
Your Name
</label>

<input type="text" id="name" name="name">


<input type="submit" value="Submit Review">

</form>

</main>


<footer>
<p>&copy; 2026 Product Review</p>
</footer>


</body>
</html>
