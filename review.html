<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Review Completed</title>

<link rel="stylesheet" href="styles/form.css">

<script src="scripts/form.js" defer></script>

</head>


<body>

<header>
<h1>Thank You!</h1>
</header>


<main>

<h2>Your review has been submitted.</h2>

<p>Total Reviews Completed: 
<span id="reviewCount"></span>
</p>


</main>


<footer>
<p>&copy; 2026 Product Review</p>
</footer>


<script>

let count = Number(localStorage.getItem("reviews")) || 0;

count++;

localStorage.setItem("reviews", count);

document.querySelector("#reviewCount").textContent = count;

</script>


</body>

</html>
